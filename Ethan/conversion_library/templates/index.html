<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visit Summary Maker</title>
<style>{% include "_style.css" %}</style>
</head>
<body>
<div class="wrap">
  <div class="app-head">
    <h1>Visit summary maker</h1>
    <p>Paste or upload a primary care note to get a short summary for the patient.</p>
  </div>

  <form class="input" method="post" enctype="multipart/form-data">
    <textarea name="note" placeholder="Paste the clinician's note here…">{{ note }}</textarea>
    <div class="row">
      <label>Or upload a note (.txt or .pdf)<input type="file" name="file" accept=".txt,.md,.pdf,text/plain,application/pdf"></label>
      <label>Or load a sample
        <select name="sample" onchange="this.form.note.value=''; this.form.submit()">
          <option value="">Choose a sample note…</option>
          {% for group, names in samples.items() %}
          <optgroup label="{{ group }}">
            {% for n in names %}<option value="{{ group }}/{{ n }}" {% if sample == group ~ '/' ~ n %}selected{% endif %}>{{ n }}</option>{% endfor %}
          </optgroup>
          {% endfor %}
        </select>
      </label>
    </div>
    <div class="row">
      <label>Patient name<input name="name" value="{{ name }}"></label>
      <label>Visit date<input name="visit_date" value="{{ visit_date_input }}" placeholder="today"></label>
      <label>Office phone (optional)<input name="phone" value="{{ phone }}"></label>
      <label>Patient reads at
        <select name="grade">
          {% for g, label in [(5, "grade 5 (needs a lot of help reading)"), (6, "grade 6"), (7, "grade 7 (reads fairly well)")] %}
          <option value="{{ g }}" {% if grade == g %}selected{% endif %}>{{ label }}</option>{% endfor %}
        </select>
      </label>
      {% if claude_available %}<label class="toggle"><input type="checkbox" name="claude" {% if use_claude %}checked{% endif %}> Write with Claude</label>{% endif %}
      <button class="btn" type="submit">Make summary</button>
    </div>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
  </form>

  {% if s %}{% include "_result.html" %}{% endif %}
</div>
</body>
</html>

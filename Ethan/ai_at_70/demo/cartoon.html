<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>AI at 70 cartoon scenes</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
/* Scenes for the AI at 70 demo video (make_video.py renders each one frame by frame at 1280x720).
   Modern flat illustration: soft color fields and gradients, no outlines, rounded cards with soft shadows.
   People have ordinary human proportions (head about 1/7 of height).
   One story, one appointment: Maria Rodriguez, 78; Dr. Lee; her daughter Sofia at home. Made-up people. */
:root{--ink:#12303d;--muted:#4f6877;--blue:#1c5d84;--teal:#38b6a9;--green:#1d7a55;--sky:#35a5e0;--amber:#f2b33d;--coral:#ee7b62;--line:#d9e6e3}
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:transparent}
#stage{position:relative;width:1280px;height:720px;overflow:hidden;font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:var(--ink)}
svg.bg{position:absolute;inset:0}
.chip{position:absolute;top:26px;left:30px;z-index:10;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.92);border-radius:999px;padding:8px 18px 8px 8px;
  font:700 19px "Plus Jakarta Sans",sans-serif;box-shadow:0 8px 24px rgba(18,48,61,.12)}
.chip b{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--teal);color:#fff;font-weight:800}
.cap{--tx:-50%;position:absolute;z-index:10;left:50%;bottom:30px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:#fff;color:var(--ink);
  font:800 28px "Plus Jakarta Sans",sans-serif;padding:13px 30px 13px 24px;border-radius:999px;box-shadow:0 14px 36px rgba(18,48,61,.22);white-space:nowrap;animation:fadeup .5s ease-out both}
.cap::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--teal)}
.bubble{position:absolute;z-index:7;background:#fff;border-radius:22px;padding:14px 22px;font:700 23px "Plus Jakarta Sans",sans-serif;box-shadow:0 12px 30px rgba(18,48,61,.16)}
.bubble.tail-l::after,.bubble.tail-r::after{content:"";position:absolute;bottom:-10px;width:22px;height:22px;background:#fff;transform:rotate(45deg);border-radius:4px}
.bubble.tail-l::after{left:36px}.bubble.tail-r::after{right:36px}
.pop{animation:pop .45s cubic-bezier(.2,1.5,.4,1) both}
.fadeup{animation:fadeup .6s ease-out both}
.slidein{animation:slidein .7s cubic-bezier(.2,1,.3,1) both}
.bob{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
.talk{animation:talk .28s steps(2) infinite;transform-box:fill-box;transform-origin:center}
.card{position:absolute;z-index:6;background:#fff;border-radius:20px;box-shadow:0 22px 54px rgba(18,48,61,.2);overflow:hidden}
.card h3{margin:0;font:800 24px "Plus Jakarta Sans",sans-serif}.sub{font:600 16px "Plus Jakarta Sans",sans-serif;color:var(--muted)}
.tick{display:flex;align-items:center;gap:14px;font:700 21px "Plus Jakarta Sans",sans-serif;padding:12px 14px;border-radius:12px;background:#f1f7f6;margin-top:10px}
.tick i{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--teal);color:#fff;font-style:normal;font-weight:800;flex:none}
.hand{font:600 33px/1.25 Caveat,cursive;color:#23408e}
.mail{font:500 16px/1.45 "Plus Jakarta Sans",sans-serif;white-space:pre-wrap;padding:18px 22px;color:var(--ink)}
.mailhead{background:#f1f7f6;padding:14px 22px;border-bottom:1px solid var(--line);font:600 16px "Plus Jakarta Sans",sans-serif;color:var(--muted)}
.mailhead b{display:block;font:800 21px "Plus Jakarta Sans",sans-serif;color:var(--blue)}
.wave{position:absolute;z-index:4;border:4px solid var(--teal);border-radius:50%;animation:wave 1.4s ease-out infinite both}
.flow{display:grid;grid-template-columns:1fr 44px 150px 44px 1fr;align-items:center;gap:6px;padding:8px 26px 26px}
.flow .col{display:grid;gap:10px}.flow .lab{font:800 14px "Plus Jakarta Sans",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.item{display:flex;align-items:center;gap:10px;font:700 18px "Plus Jakarta Sans",sans-serif;background:#f1f7f6;border-radius:12px;padding:10px 12px}
.item span{font-size:22px}.item small{display:block;font:600 13px "Plus Jakarta Sans",sans-serif;color:var(--muted)}
.item.opt{background:#fff;border:2px dashed #b9cfca}.item.out{background:#e4f4f1}
.arrowx{font:800 30px "Plus Jakarta Sans",sans-serif;color:var(--teal);text-align:center}
.core{display:grid;place-items:center;gap:6px;text-align:center;background:linear-gradient(160deg,#1c5d84,#38b6a9);color:#fff;border-radius:18px;padding:18px 10px;font:800 21px "Plus Jakarta Sans",sans-serif}
.core img{width:64px;background:#fff;border-radius:12px;padding:6px}.core small{font:600 13px "Plus Jakarta Sans",sans-serif;opacity:.9}
.badge{display:flex;align-items:center;gap:16px;background:#fff;border-radius:18px;padding:16px 22px;box-shadow:0 14px 34px rgba(18,48,61,.16);font:800 24px "Plus Jakarta Sans",sans-serif}
.badge span{font-size:32px}.badge i{margin-left:auto;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;font-style:normal}
.end{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:linear-gradient(135deg,#eaf6f3 0%,#dceefa 100%)}
.end img{width:190px;position:relative}.end h1{position:relative;font:800 96px "Plus Jakarta Sans",sans-serif;letter-spacing:-.03em;color:var(--blue);margin:6px 0 0}
.end .words{position:relative;display:flex;gap:26px;justify-content:center;margin-top:12px}.end .words span{font:800 38px "Plus Jakarta Sans",sans-serif;color:var(--green)}
.end p{position:relative;font:600 24px "Plus Jakarta Sans",sans-serif;color:var(--muted);margin-top:18px}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fadeup{from{transform:translate(var(--tx,0),18px);opacity:0}to{transform:translate(var(--tx,0),0);opacity:1}}
@keyframes slidein{from{transform:translateX(100px);opacity:0}to{transform:none;opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes talk{0%{transform:scaleY(1)}100%{transform:scaleY(.3)}}
@keyframes wave{from{transform:scale(.4);opacity:.9}to{transform:scale(1.6);opacity:0}}
@keyframes flash{0%{opacity:0}20%{opacity:.8}100%{opacity:0}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(18px,-12px)}}
</style></head><body><div id="stage"></div>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe4f7"/><stop offset="1" stop-color="#e6f5fb"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <linearGradient id="floorShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".06"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
</defs></svg>
<script>
const P = new URLSearchParams(location.search);
const DATA = JSON.parse(decodeURIComponent(P.get("data") || "%7B%7D"));
const stage = document.getElementById("stage");
const INK = "#12303d";

// ---------- people ----------
// Ordinary human proportions. x, y = feet; s = scale. Standing height is about 405 px at s = 1.
// pose: "stand" | "sit". arm (right arm): "down" | "hold" (in front of the chest) | "phone" (to the ear) | "present" (held out).
// look: "happy" | "talk" | "neutral". prop: SVG drawn at the right hand.
const line = (x1, y1, x2, y2, w, c) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
function person(o) {
  const { x, y, s = 1, skin, hair, hairStyle, top, bottom = "#3f4a5c", shoes = "#2c3440", skirt, pose = "stand", arm = "down",
          look = "happy", glasses, coat, flip, prop } = o;
  const sit = pose === "sit", u = sit ? 60 : 0;
  const hy = -372 + u, hipY = -185 + u, waistY = -235 + u, shY = -330 + u;
  const legC = skirt ? skin : bottom;
  let legs = "";
  for (const sx of [-1, 1]) {
    if (sit) legs += line(sx * 19, hipY, sx * 22, hipY + 26, 32, skirt || bottom) + line(sx * 22, hipY + 30, sx * 22, -16, 20, legC);
    else legs += line(sx * 18, hipY, sx * 19, -98, 27, legC) + line(sx * 19, -98, sx * 19, -16, 21, legC);
    legs += `<ellipse cx="${sx * 24}" cy="-8" rx="18" ry="8" fill="${shoes}"/>`;
  }
  const skirtG = skirt ? (sit ? `<path d="M-34 ${waistY} L-48 ${hipY + 36} Q0 ${hipY + 46} 48 ${hipY + 36} L34 ${waistY}Z" fill="${skirt}"/>`
                              : `<path d="M-34 ${waistY} L-50 -104 Q0 -96 50 -104 L34 ${waistY}Z" fill="${skirt}"/>`) : "";
  const torso = `<path d="M-44 ${shY + 6} Q-44 ${shY - 6} -30 ${shY - 6} L30 ${shY - 6} Q44 ${shY - 6} 44 ${shY + 6} L38 ${waistY} L40 ${hipY} L-40 ${hipY} L-38 ${waistY}Z" fill="${top}"/>`;
  const coatG = coat ? `<path d="M-46 ${shY + 4} Q-44 ${shY - 6} -14 ${shY - 6} L-6 ${shY + 72} L-4 -106 L-58 -102 L-46 ${waistY}Z M46 ${shY + 4} Q44 ${shY - 6} 14 ${shY - 6} L6 ${shY + 72} L4 -106 L58 -102 L46 ${waistY}Z" fill="#ffffff"/>
    <path d="M-6 ${shY + 72} L-4 -106 M6 ${shY + 72} L4 -106" stroke="#dfe7ec" stroke-width="3"/>
    <path d="M-16 ${shY - 2} q-10 50 4 74 q18 10 24 -8" stroke="#5b6f80" stroke-width="3.5" fill="none"/><circle cx="12" cy="${shY + 66}" r="6" fill="#8a9aa8"/>
    <rect x="20" y="${shY + 36}" width="16" height="20" rx="3" fill="#e3edf3"/>` : "";
  const sleeve = coat ? "#ffffff" : top;
  const L = sit ? [[-44, shY + 8], [-50, shY + 72], [-28, hipY + 6]] : [[-44, shY + 8], [-52, shY + 78], [-54, shY + 148]];
  const R = { down: sit ? [[44, shY + 8], [50, shY + 72], [28, hipY + 6]] : [[44, shY + 8], [52, shY + 78], [54, shY + 148]],
              hold: [[44, shY + 8], [52, shY + 76], [22, shY + 62]],
              phone: [[44, shY + 8], [64, shY + 40], [26, hy + 4]],
              present: [[44, shY + 8], [80, shY + 44], [112, shY + 10]] }[arm];
  const armG = (a, back) => `<g ${back ? 'style="filter:brightness(.92)"' : ""}>${line(a[0][0], a[0][1], a[1][0], a[1][1], 19, sleeve)}${line(a[1][0], a[1][1], a[2][0], a[2][1], 17, sleeve)}
    ${coat ? `<circle cx="${a[1][0]}" cy="${a[1][1]}" r="0"/>` : ""}<circle cx="${a[2][0]}" cy="${a[2][1]}" r="9.5" fill="${skin}"/></g>`;
  const mouth = look === "talk" ? `<ellipse class="talk" cx="0" cy="${hy + 15}" rx="6" ry="5" fill="#6b2b22"/>`
    : look === "neutral" ? `<path d="M-6 ${hy + 15} h12" stroke="#6b2b22" stroke-width="2.6" stroke-linecap="round"/>`
    : `<path d="M-8 ${hy + 12} q8 8 16 0" stroke="#6b2b22" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  const hairBack = hairStyle === "ponytail" ? `<path d="M14 ${hy - 20} q30 6 24 40 q-4 22 -16 30 q6 -26 -14 -50z" fill="${hair}"/>` : "";
  const hairTop = hairStyle === "bun"
      ? `<circle cx="0" cy="${hy - 36}" r="12" fill="${hair}"/><path d="M-25 ${hy + 2} Q-30 ${hy - 33} 0 ${hy - 33} Q30 ${hy - 33} 25 ${hy + 2} Q22 ${hy - 18} 0 ${hy - 20} Q-22 ${hy - 18} -25 ${hy + 2}Z" fill="${hair}"/>`
    : hairStyle === "ponytail"
      ? `<path d="M-25 ${hy - 2} Q-28 ${hy - 33} 2 ${hy - 33} Q28 ${hy - 31} 25 ${hy - 4} Q14 ${hy - 22} -6 ${hy - 20} Q-20 ${hy - 16} -25 ${hy - 2}Z" fill="${hair}"/>`
      : `<path d="M-25 ${hy - 4} Q-26 ${hy - 33} 0 ${hy - 33} Q26 ${hy - 33} 25 ${hy - 4} Q22 ${hy - 20} 6 ${hy - 22} L-4 ${hy - 16} Q-20 ${hy - 18} -25 ${hy - 4}Z" fill="${hair}"/>`;
  const specs = glasses ? `<g stroke="#4a3a33" stroke-width="2.2" fill="rgba(255,255,255,.25)"><rect x="-18" y="${hy - 10}" width="15" height="12" rx="5"/><rect x="3" y="${hy - 10}" width="15" height="12" rx="5"/><path d="M-3 ${hy - 5} h6"/></g>` : "";
  const head = `${hairBack}<rect x="-8" y="${hy + 22}" width="16" height="${shY - hy - 22}" fill="${skin}" style="filter:brightness(.92)"/>
    <ellipse cx="-24" cy="${hy + 2}" rx="5" ry="7" fill="${skin}"/><ellipse cx="24" cy="${hy + 2}" rx="5" ry="7" fill="${skin}"/>
    <ellipse cx="0" cy="${hy}" rx="24" ry="30" fill="${skin}"/>
    <ellipse cx="-10" cy="${hy - 4}" rx="2.6" ry="3.2" fill="${INK}"/><ellipse cx="10" cy="${hy - 4}" rx="2.6" ry="3.2" fill="${INK}"/>
    <path d="M-15 ${hy - 13} q5 -3 9 0 M6 ${hy - 13} q5 -3 9 0" stroke="${hair === "#e2ded8" ? "#9b948c" : hair}" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M0 ${hy + 1} q3 5 -1 7" stroke="#000" stroke-opacity=".18" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <circle cx="-14" cy="${hy + 8}" r="5" fill="#f08a7a" opacity=".3"/><circle cx="14" cy="${hy + 8}" r="5" fill="#f08a7a" opacity=".3"/>
    ${mouth}${hairTop}${specs}`;
  const hand = R[2];
  return `<g transform="translate(${x} ${y})"><ellipse cx="0" cy="0" rx="${sit ? 0 : 56 * s}" ry="${9 * s}" fill="#000" opacity=".08"/></g>
    <g transform="translate(${x} ${y}) scale(${flip ? -s : s} ${s})"><g class="bob">
    ${legs}${torso}${skirtG}${coatG}${armG(L, true)}${head}${armG(R, false)}
    ${prop ? `<g transform="translate(${hand[0]} ${hand[1]})">${prop}</g>` : ""}
  </g></g>`;
}
const MARIA = { skin: "#d9a47c", hair: "#e2ded8", hairStyle: "bun", top: "#c98bb9", skirt: "#4f6d8f", glasses: true, shoes: "#6b4a3a" };
const SOFIA = { skin: "#c98e66", hair: "#3e2618", hairStyle: "ponytail", top: "#38b6a9", bottom: "#33475b" };
const DOCTOR = { skin: "#e8c19a", hair: "#1f1b19", hairStyle: "short", top: "#7fb2d6", bottom: "#46546a", coat: true };

// props, drawn around the hand
const PROPS = {
  tablet: `<g transform="rotate(-12) translate(-24 -54)"><rect width="52" height="68" rx="7" fill="#1f2d36"/><rect x="4" y="5" width="44" height="58" rx="4" fill="#fff"/><path d="M10 18 h22 M10 30 h30 M10 42 h18" stroke="#38b6a9" stroke-width="4" stroke-linecap="round"/></g>`,
  clipboard: `<g transform="rotate(-8) translate(-30 -60)"><rect width="58" height="76" rx="6" fill="#a8774f"/><rect x="5" y="9" width="48" height="62" rx="3" fill="#fff"/><rect x="18" y="2" width="22" height="9" rx="3" fill="#7a8a96"/><path d="M11 24 h30 M11 34 h36 M11 44 h26 M11 54 h32" stroke="#23408e" stroke-width="2.5" stroke-linecap="round"/></g>`,
  paper: `<g transform="rotate(-6) translate(-22 -56)"><rect width="50" height="64" rx="3" fill="#fff" stroke="#d9e6e3" stroke-width="2"/><rect x="6" y="7" width="22" height="5" rx="2" fill="#1c5d84"/><path d="M6 20 h36 M6 28 h30 M6 36 h36 M6 44 h24" stroke="#9fb4bf" stroke-width="3" stroke-linecap="round"/></g>`,
  phone: `<g transform="rotate(-8) translate(-14 -40)"><rect width="30" height="54" rx="6" fill="#1f2d36"/><rect x="3" y="5" width="24" height="44" rx="3" fill="#bfe4f7"/></g>`,
  phoneEar: `<g transform="rotate(-18) translate(-10 -30)"><rect width="22" height="44" rx="6" fill="#1f2d36"/></g>`,
};

// ---------- rooms: flat, soft, modern ----------
const blobs = (list) => list.map(([x, y, r, c, o = 0.5]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" opacity="${o}"/>`).join("");
const plant = (x, y) => `<g transform="translate(${x} ${y})"><path d="M-26 0 L-20 -60 L20 -60 L26 0Z" fill="#e9d8c4"/>
  <path d="M0 -60 q-50 -40 -36 -120 q30 40 36 120 M0 -60 q46 -50 30 -130 q-34 50 -30 130 M0 -60 q-10 -70 4 -150 q14 70 -4 150" fill="#3f9e7a"/></g>`;
const room = (wall, floor, extra = "") => `<svg class="bg" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="${wall}"/>${extra}
  <rect y="560" width="1280" height="160" fill="${floor}"/><rect y="560" width="1280" height="70" fill="url(#floorShade)"/></svg>`;
const waitingRoom = () => room("#e8f3f0", "#d3e3de", blobs([[200, 140, 160, "#d4ece6"], [1100, 120, 200, "#dcebf6"]]) + `
  <rect x="860" y="380" width="380" height="180" rx="16" fill="#ffffff"/><rect x="860" y="380" width="380" height="22" rx="10" fill="#38b6a9"/>
  <rect x="940" y="460" width="220" height="64" rx="32" fill="#1c5d84"/><text x="1050" y="503" text-anchor="middle" font-family="Plus Jakarta Sans" font-weight="800" font-size="28" fill="#fff">Check-in</text>
  ${plant(90, 560)}<rect x="440" y="90" width="150" height="110" rx="12" fill="#f6d7a3"/><circle cx="490" cy="132" r="22" fill="#ee7b62" opacity=".8"/><path d="M450 190 l46 -44 l36 26 l50 -34 v62z" fill="#38b6a9" opacity=".8"/>`);
const examRoom = () => room("#edf3f8", "#d5e1ea", blobs([[1040, 160, 190, "#dde9f4"], [180, 420, 150, "#e3efe9"]]) + `
  <rect x="80" y="90" width="300" height="220" rx="16" fill="url(#sky)"/><rect x="226" y="90" width="8" height="220" fill="#fff"/><rect x="80" y="196" width="300" height="8" fill="#fff"/>
  <circle cx="150" cy="150" r="70" fill="url(#glow)"/>
  <rect x="1080" y="110" width="120" height="90" rx="12" fill="#1f2d36"/><path d="M1094 160 h24 l8 -18 l10 32 l8 -14 h42" stroke="#38b6a9" stroke-width="4" fill="none" stroke-linejoin="round"/>`);
const livingRoom = () => room("#f6efe6", "#e4d3bf", blobs([[1080, 140, 210, "#fbe3cf"], [250, 120, 150, "#eef3ea"]]) + `
  <rect x="740" y="90" width="300" height="230" rx="18" fill="url(#sky)"/><rect x="886" y="90" width="8" height="230" fill="#fff"/>
  <path d="M1180 560 V250 q0 -60 -70 -70" stroke="#2c3440" stroke-width="6" fill="none"/><path d="M1080 170 q30 -30 60 0z" fill="#f2b33d"/>
  ${plant(1230, 560)}<rect x="300" y="130" width="140" height="100" rx="10" fill="#cfe6e0"/><rect x="460" y="150" width="90" height="120" rx="10" fill="#f3c9b6"/>`);
const sofa = (x, w, y = 610) => `<g transform="translate(${x} ${y})"><rect x="0" y="-300" width="${w}" height="190" rx="34" fill="#5d86a8"/>
  <rect x="-24" y="-180" width="${w + 48}" height="70" rx="26" fill="#6b94b6"/><rect x="0" y="-130" width="${w}" height="40" rx="14" fill="#7aa2c3"/>
  <rect x="10" y="-92" width="12" height="92" rx="5" fill="#2c3440"/><rect x="${w - 22}" y="-92" width="12" height="92" rx="5" fill="#2c3440"/></g>`;
const chair = (x, y, c = "#38b6a9") => `<g transform="translate(${x} ${y})"><rect x="-80" y="-290" width="160" height="170" rx="30" fill="${c}"/>
  <rect x="-92" y="-134" width="184" height="36" rx="16" fill="${c}" style="filter:brightness(1.08)"/><rect x="-74" y="-98" width="10" height="98" rx="4" fill="#2c3440"/><rect x="64" y="-98" width="10" height="98" rx="4" fill="#2c3440"/></g>`;
const svg = (inner) => `<svg class="bg" viewBox="0 0 1280 720">${inner}</svg>`;

// ---------- helpers ----------
const add = (html) => stage.insertAdjacentHTML("beforeend", html);
const delay = (s) => `style="animation-delay:${s}s"`;
const caption = (text, d = 0.2) => add(`<div class="cap" style="animation-delay:${d}s">${text}</div>`);
const chip = (n, text) => add(`<div class="chip"><b>${n}</b>${text}</div>`);

// ---------- scenes: one appointment, start to finish ----------
const SCENES = {
  arrive() {  // Maria arrives and answers the check-in
    add(waitingRoom());
    add(svg(chair(400, 610) + person({ ...MARIA, x: 400, y: 610, pose: "sit", arm: "hold", prop: PROPS.tablet })));
    add(`<div class="card slidein" style="left:620px;top:110px;width:520px;padding:26px 28px;animation-delay:.3s"><h3>Today's check-in</h3><div class="sub">A few simple questions</div>
      ${[["Follow-up visit", 1.0], ["Help remembering medicines", 1.7], ["Share my summary with my daughter, Sofia", 2.4]]
        .map(([t, d]) => `<div class="tick pop" style="animation-delay:${d}s"><i>✓</i>${t}</div>`).join("")}</div>`);
    chip(1, "Check-in"); caption("Maria arrives for her visit");
  },
  visit() {  // Dr. Lee takes notes
    add(examRoom());
    add(svg(chair(320, 610, "#9ec3dc") + person({ ...MARIA, x: 320, y: 610, pose: "sit", look: "neutral" }) + person({ ...DOCTOR, x: 650, y: 620, arm: "hold", look: "talk", flip: true, prop: PROPS.clipboard })));
    add(`<div class="card slidein" style="left:800px;top:220px;width:430px;padding:22px 28px;background:#fffef6;transform:rotate(1.5deg);animation-delay:.2s">
      <div class="sub" style="margin-bottom:6px">Dr. Lee's notes</div>
      ${["Bilat. leg edema x 2 wks", "↓ amlodipine to 5 mg daily", "↑ metformin 1000 mg BID", "BMP + urine microalb today", "F/u 4 wks · ER / 911 if CP"]

// make_video.py pauses every animation and steps through time: window.seek(seconds)
window.seek = (t) => document.getAnimations().forEach((a) => { a.pause(); a.currentTime = t * 1000; });
Promise.all([...document.images].map((i) => i.decode().catch(() => {}))).then(() => document.fonts.ready).then(() => { window.ready = true; });
